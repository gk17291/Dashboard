<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>설비 상태 Monitoring System</title>
<style>
  :root{
    --bg:#f3f5f9; --card:#fff; --text:#1c2333; --muted:#6b7385; --line:#dde2ec;
    --primary:#2455d6; --primary-d:#1b43ad; --warn:#d92d20; --warn-bg:#fef3f2; --ok:#12805c; --ok-bg:#ecfdf3;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1420; --card:#171e2e; --text:#e8ecf5; --muted:#97a1b8; --line:#2a3349;
      --primary:#5b84f5; --primary-d:#7b9bf7; --warn:#ff7b70; --warn-bg:#3a1c1a; --ok:#4ad19b; --ok-bg:#12302a; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
  header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 32px;background:var(--card);border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:22px}
  #clock{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  main{max-width:900px;margin:32px auto;padding:0 16px}
  .screen{display:none}.screen.active{display:block}
  .desc{text-align:center;color:var(--muted);font-size:15px;line-height:1.7;margin:0 0 24px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:20px}
  .panel h2{margin:0 0 16px;font-size:17px}
  .loaders{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:640px){.loaders{grid-template-columns:1fr}}
  .drop{border:2px dashed var(--line);border-radius:10px;padding:24px 16px;text-align:center;cursor:pointer;transition:.15s}
  .drop:hover,.drop.over{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 6%,transparent)}
  .drop.loaded{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
  .drop .t{font-weight:700;margin-bottom:6px}
  .drop .f{font-size:13px;color:var(--muted);word-break:break-all}
  .drop input{display:none}
  .actions{display:flex;flex-direction:column;gap:12px;align-items:stretch}
  button{font:inherit;border:0;border-radius:8px;padding:12px 20px;cursor:pointer;font-weight:700}
  .btn-sub{background:transparent;color:var(--primary);border:1px solid var(--primary)}
  .btn-sub:hover{background:color-mix(in srgb,var(--primary) 10%,transparent)}
  .btn-main{background:var(--primary);color:#fff;font-size:16px;padding:14px}
  .btn-main:hover:not(:disabled){background:var(--primary-d)}
  button:disabled{opacity:.4;cursor:not-allowed}
  #err{color:var(--warn);font-size:14px;min-height:20px}
  .summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  .stat{flex:1;min-width:140px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .stat .n{font-size:28px;font-weight:700}.stat .l{font-size:13px;color:var(--muted)}
  .stat.bad .n{color:var(--warn)}
  .stat.good .n{color:var(--ok)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  .eq{background:var(--warn-bg);border:1px solid var(--warn);border-radius:12px;padding:18px;text-align:center}
  .eq .name{font-size:22px;font-weight:700}
  .eq .vals{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:12px}
  .eq .v{display:flex;flex-direction:column;gap:2px}
  .eq .v span{font-size:12px;color:var(--muted)}
  .eq .v b{font-size:20px}
  .eq .vs{color:var(--warn);font-weight:700;font-size:18px}
  .eq .chk{margin-top:8px;color:var(--warn);font-weight:800;font-size:16px}
  .eq .det{margin-top:10px;font-size:12px;color:var(--muted)}
  .allok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok);border-radius:12px;padding:24px;text-align:center;font-weight:700}
  .back{margin-top:8px;background:transparent;color:var(--primary);border:1px solid var(--primary)}
  .modal{position:fixed;inset:0;background:rgba(10,15,30,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
  .modal.hide{display:none}
  .dlg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:420px}
  .dlg h2{margin:0 0 18px;font-size:20px}
  .dlg .row{margin-bottom:14px}
  .dlg label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .dlg .mid{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:Consolas,monospace;font-size:14px}
  .dlg input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
  .dlg input:focus{outline:2px solid var(--primary);border-color:transparent}
  .dlg .btn-main{width:100%;margin-top:6px}
  .chat-fab{position:fixed;right:24px;bottom:24px;z-index:50;border-radius:999px;background:var(--primary);color:#fff;padding:14px 20px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .chat{position:fixed;right:24px;bottom:24px;z-index:60;width:380px;max-width:calc(100vw - 32px);height:520px;max-height:calc(100vh - 48px);background:var(--card);border:1px solid var(--line);border-radius:14px;display:none;flex-direction:column;box-shadow:0 8px 28px rgba(0,0,0,.3)}
  .chat.open{display:flex}
  .chat-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700}
  .chat-h button{background:none;color:var(--muted);padding:2px 8px;font-size:18px}
  .chat-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:85%;padding:9px 12px;border-radius:12px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .msg.user{align-self:flex-end;background:var(--primary);color:#fff}
  .msg.bot{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
  .msg.err{align-self:flex-start;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
  .chat-f{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
  .chat-f input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
  .chat-f button{padding:10px 16px}
</style>
</head>
<body>
<header>
  <h1>설비 상태 Monitoring System</h1>
  <div id="clock"></div>
</header>

<main>
  <p class="desc">실제 설비에서 추출한 Excel 데이터와 System 기반 Excel 데이터를 대조하여,<br>감지 Data 값이 서로 다른 설비를 자동으로 찾아 확인이 필요한 설비로 알려주는 System입니다.</p>
  <!-- 1번째 화면 -->
  <section id="s1" class="screen active">
    <div class="panel">
      <h2>Excel 데이터 로드</h2>
      <div class="loaders">
        <label class="drop" id="drop1">
          <div class="t">① 실제 설비 Excel Data</div>
          <div class="f" id="name1">클릭 또는 파일을 끌어다 놓으세요</div>
          <input type="file" id="file1" accept=".xlsx">
        </label>
        <label class="drop" id="drop2">
          <div class="t">② System 기반 Excel Data</div>
          <div class="f" id="name2">클릭 또는 파일을 끌어다 놓으세요</div>
          <input type="file" id="file2" accept=".xlsx">
        </label>
      </div>
    </div>
    <div class="actions">
      <div id="err"></div>
      <button class="btn-sub" id="sampleBtn">Sample data 입력</button>
      <button class="btn-main" id="compareBtn" disabled>대조 진행</button>
    </div>
  </section>

  <!-- 2번째 화면 -->
  <section id="s2" class="screen">
    <div class="summary" id="summary"></div>
    <div class="panel">
      <h2>감지 Data 불일치 설비</h2>
      <div id="result"></div>
    </div>
    <button class="back" id="backBtn">← 처음 화면으로</button>
  </section>
</main>

<button class="chat-fab" id="chatFab">💬 챗봇</button>
<div class="chat" id="chat">
  <div class="chat-h"><span>Data Q&amp;A Chatbot</span><button id="chatClose" aria-label="닫기">✕</button></div>
  <div class="chat-log" id="chatLog"></div>
  <form class="chat-f" id="chatForm" autocomplete="off">
    <input id="chatIn" placeholder="업로드한 데이터에 대해 질문하세요">
    <button type="submit" class="btn-main" id="chatSend">전송</button>
  </form>
</div>
<div class="modal" id="keyModal">
  <form class="dlg" id="keyForm" autocomplete="off">
    <h2>API Key 입력</h2>
    <div class="row"><label>모델 ID</label><div class="mid" id="modelView"></div></div>
    <div class="row"><label for="apiKey">API Key</label><input type="password" id="apiKey" placeholder="API Key를 입력하세요" autocomplete="off"></div>
    <button type="submit" class="btn-main" id="keyOk" disabled>확인</button>
  </form>
</div>

/* ---------- 최소 xlsx 파서 (ZIP + XML) ---------- */
async function inflateRaw(bytes){
  const ds = new DecompressionStream('deflate-raw');
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function unzip(buf){
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let e = u8.length - 22;
  while(e >= 0 && dv.getUint32(e,true) !== 0x06054b50) e--;
  if(e < 0) throw new Error('올바른 xlsx 파일이 아닙니다.');
  const count = dv.getUint16(e+10,true);
  let p = dv.getUint32(e+16,true);
  const files = {}, dec = new TextDecoder('utf-8');
  for(let i=0;i<count;i++){
    const method = dv.getUint16(p+10,true), csize = dv.getUint32(p+20,true);
    const nlen = dv.getUint16(p+28,true), elen = dv.getUint16(p+30,true), clen = dv.getUint16(p+32,true);
    const lho = dv.getUint32(p+42,true);
    const name = dec.decode(u8.subarray(p+46,p+46+nlen));
    const dstart = lho + 30 + dv.getUint16(lho+26,true) + dv.getUint16(lho+28,true);
    const raw = u8.subarray(dstart, dstart+csize);
    files[name] = {method, raw};
    p += 46 + nlen + elen + clen;
  }
  return files;
}
async function readText(files, name){
  const f = files[name]; if(!f) return null;
  const data = f.method === 0 ? f.raw : await inflateRaw(f.raw);
  return new TextDecoder('utf-8').decode(data);
}
function colIndex(ref){
  const m = /^([A-Z]+)/.exec(ref); let n = 0;
  for(const ch of m[1]) n = n*26 + ch.charCodeAt(0) - 64;
  return n-1;
}
async function parseXlsx(buf){
  const files = await unzip(buf);
  const parser = new DOMParser();
  const shared = [];
  const ssXml = await readText(files,'xl/sharedStrings.xml');
  if(ssXml){
    parser.parseFromString(ssXml,'application/xml').querySelectorAll('si').forEach(si=>{
      shared.push([...si.querySelectorAll('t')].map(t=>t.textContent).join(''));
    });
  }
  let sheetName = Object.keys(files).filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort()[0];
  if(!sheetName) throw new Error('시트를 찾을 수 없습니다.');
  const doc = parser.parseFromString(await readText(files,sheetName),'application/xml');
  const rows = [];
  doc.querySelectorAll('sheetData > row').forEach(r=>{
    const row = [];
    r.querySelectorAll('c').forEach(c=>{
      const t = c.getAttribute('t'), v = c.querySelector('v');
      let val = '';
      if(t === 's' && v) val = shared[+v.textContent] ?? '';
      else if(t === 'inlineStr') val = [...c.querySelectorAll('t')].map(x=>x.textContent).join('');
      else if(v) val = v.textContent;
      row[colIndex(c.getAttribute('r'))] = val;
    });
    rows.push(row);
  });
  return rows;
}
function b64ToBuf(b64){
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
  return u.buffer;
}

/* ---------- 화면 1 ---------- */
const data = [null,null];
const $ = id => document.getElementById(id);
const err = $('err');

function refresh(){
  [0,1].forEach(i=>$('drop'+(i+1)).classList.toggle('loaded', !!data[i]));
  $('compareBtn').disabled = !(data[0] && data[1]);
}
async function loadBuf(i, buf, name){
  try{
    const rows = await parseXlsx(buf);
    if(rows.length < 2) throw new Error('데이터가 없습니다.');
    data[i] = rows;
    $('name'+(i+1)).textContent = `${name} (${rows.length-1}행)`;
    err.textContent = '';
  }catch(ex){
    data[i] = null;
    $('name'+(i+1)).textContent = '클릭 또는 파일을 끌어다 놓으세요';
    err.textContent = `${name}: ${ex.message}`;
  }
  refresh();
}
[1,2].forEach(n=>{
  const input = $('file'+n), drop = $('drop'+n);
  const handle = f => f && f.arrayBuffer().then(b=>loadBuf(n-1,b,f.name));
  input.addEventListener('change',()=>handle(input.files[0]));
  drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over')});
  drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
  drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');handle(e.dataTransfer.files[0])});
});
$('sampleBtn').addEventListener('click', async ()=>{
  await loadBuf(0, b64ToBuf(SAMPLE1_B64), 'sample data 3.xlsx');
  await loadBuf(1, b64ToBuf(SAMPLE2_B64), 'sample data 4.xlsx');
});

/* ---------- 화면 2 ---------- */
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active', s.id===id));
}
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

$('compareBtn').addEventListener('click',()=>{
  const [a,b] = data;
  const total = Math.max(a.length,b.length) - 1;
  const diffs = [];
  for(let i=1;i<=total;i++){
    const ra = a[i]||[], rb = b[i]||[];
    const na = String(ra[0]??'').trim(), nb = String(rb[0]??'').trim();
    const va = String(ra[1]??'').trim(), vb = String(rb[1]??'').trim();
    if(va !== vb || na !== nb) diffs.push({row:i+1, name:na||nb, va, vb});
  }
  lastDiffs = diffs;
  $('summary').innerHTML =
    `<div class="stat"><div class="n">${total}</div><div class="l">전체 대조 건수</div></div>
     <div class="stat good"><div class="n">${total-diffs.length}</div><div class="l">일치</div></div>
     <div class="stat bad"><div class="n">${diffs.length}</div><div class="l">불일치</div></div>`;
  $('result').innerHTML = diffs.length
    ? `<div class="cards">${diffs.map(d=>`
        <div class="eq">
          <div class="name">${esc(d.name)}</div>
          <div class="vals">
            <div class="v"><span>실제 설비</span><b>${esc(d.va)||'-'}</b></div>
            <div class="vs">≠</div>
            <div class="v"><span>System</span><b>${esc(d.vb)||'-'}</b></div>
          </div>
          <div class="chk">확인필요!</div>
          <div class="det">${d.row}행</div>
        </div>`).join('')}</div>`
    : `<div class="allok">모든 설비의 감지 Data가 일치합니다.</div>`;
  show('s2');
});
$('backBtn').addEventListener('click',()=>show('s1'));

/* ---------- 챗봇 (업로드 데이터 기반 질문/답변) ---------- */
let lastDiffs = null;
const chatHistory = [];
function dataContext(){
  const fmt = rows => rows ? rows.map(r=>`${r[0]??''},${r[1]??''}`).join('\n') : '(미업로드)';
  let t = '[실제 설비 Excel Data] (설비명,감지 Data; 첫 줄은 헤더, 행 번호는 Excel 기준 2부터)\n' + fmt(data[0]) +
          '\n\n[System 기반 Excel Data]\n' + fmt(data[1]);
  if(lastDiffs){
    t += '\n\n[대조 결과: 행 순서 기준 불일치]\n' + (lastDiffs.length
      ? lastDiffs.map(d=>`${d.row}행 ${d.name}: 실제 설비=${d.va||'-'}, System=${d.vb||'-'}`).join('\n')
      : '불일치 없음');
  }
  return t;
}
function addMsg(cls, text){
  const el = document.createElement('div');
  el.className = 'msg ' + cls; el.textContent = text;
  $('chatLog').appendChild(el); $('chatLog').scrollTop = 1e9;
  return el;
}
function chatToggle(open){
  $('chat').classList.toggle('open', open);
  $('chatFab').style.display = open ? 'none' : '';
  if(open) $('chatIn').focus();
}
$('chatFab').addEventListener('click',()=>chatToggle(true));
$('chatClose').addEventListener('click',()=>chatToggle(false));
addMsg('bot','업로드한 Excel 데이터와 대조 결과를 바탕으로 답변합니다. 예: "확인이 필요한 설비는?", "ABC1의 값은 뭐가 달라?"');
$('chatForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const q = $('chatIn').value.trim();
  if(!q) return;
  if(!data[0] && !data[1]){ addMsg('err','먼저 Excel 데이터를 로드해 주세요.'); return; }
  $('chatIn').value = ''; addMsg('user', q);
  chatHistory.push({role:'user', content:q});
  $('chatSend').disabled = true;
  const wait = addMsg('bot','답변 중...');
  try{
    const res = await fetch(APP_CONFIG.baseUrl.replace(/\/$/,'') + '/chat/completions', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer ' + APP_CONFIG.apiKey},
      body: JSON.stringify({
        model: APP_CONFIG.model,
        messages: [
          {role:'system', content:'당신은 설비 상태 Monitoring System의 도우미입니다. 아래 데이터만 근거로 한국어로 간결하게 답변하세요. 데이터에 없는 내용은 모른다고 답하세요.\n\n' + dataContext()},
          ...chatHistory.slice(-10)
        ]
      })
    });
    if(!res.ok) throw new Error(`요청 실패 (${res.status}) ${(await res.text()).slice(0,200)}`);
    const json = await res.json();
    const ans = json.choices?.[0]?.message?.content?.trim() || '(빈 응답)';
    wait.textContent = ans; chatHistory.push({role:'assistant', content:ans});
  }catch(ex){
    wait.className = 'msg err'; wait.textContent = '오류: ' + ex.message;
    chatHistory.pop();
  }
  $('chatSend').disabled = false; $('chatLog').scrollTop = 1e9;
});
</script>
